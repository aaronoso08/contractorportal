<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEA Payout Tracker | Latino Built</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #2a3441;
    --accent: #e8a838;
    --accent2: #2ecc71;
    --danger: #e74c3c;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --text-dim: #4a5568;
    --paid: #1a3a2a;
    --paid-border: #2ecc71;
    --unpaid: #2a1a1a;
    --unpaid-border: #e74c3c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-badge {
    background: var(--accent);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 5px 10px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat {
    background: var(--surface);
    padding: 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }

  .stat-value.green { color: var(--accent2); }
  .stat-value.amber { color: var(--accent); }
  .stat-value.red { color: var(--danger); }

  /* Main layout */
  .main {
    padding: 28px 32px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--accent);
    color: #000;
  }

  .filter-btn:hover:not(.active) {
    color: var(--text);
    background: var(--surface2);
  }

  .search-input {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dim); }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover { background: #d4941f; }

  .btn-ghost {
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 12px 16px;
    text-align: left;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  tbody tr.is-paid { background: rgba(46, 204, 113, 0.04); }
  tbody tr.is-paid:hover { background: rgba(46, 204, 113, 0.08); }

  td {
    padding: 13px 16px;
    font-size: 14px;
    vertical-align: middle;
  }

  .td-date {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .td-client {
    font-weight: 500;
    color: var(--text);
  }

  .td-address {
    color: var(--text-muted);
    font-size: 13px;
    max-width: 220px;
  }

  .contractor-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .td-amount {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    white-space: nowrap;
  }

  .paid-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .toggle-switch {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
  }

  .toggle-slider:before {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    left: 3px;
    top: 3px;
    background: var(--text-muted);
    border-radius: 50%;
    transition: 0.2s;
  }

  input:checked + .toggle-slider { background: var(--accent2); }
  input:checked + .toggle-slider:before {
    transform: translateX(16px);
    background: #fff;
  }

  .paid-label {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
  }

  .paid-label.yes { color: var(--accent2); }
  .paid-label.no { color: var(--text-dim); }

  .action-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    padding: 4px 6px;
    border-radius: 4px;
    transition: all 0.15s;
    font-size: 15px;
  }

  .action-btn:hover { color: var(--danger); background: rgba(231,76,60,0.1); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    position: relative;
  }

  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--text);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }

  .form-group select option { background: var(--surface2); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    justify-content: flex-end;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  /* Contractor colors */
  .c-olvera { background: rgba(52,152,219,0.15); color: #5dade2; }
  .c-jara { background: rgba(46,204,113,0.15); color: #58d68d; }
  .c-as { background: rgba(155,89,182,0.15); color: #bb8fce; }
  .c-as-hc { background: rgba(231,76,60,0.15); color: #ec7063; }
  .c-dunamis { background: rgba(230,126,34,0.15); color: #f0a500; }
  .c-mps { background: rgba(26,188,156,0.15); color: #48c9b0; }
  .c-other { background: rgba(127,140,141,0.15); color: #aab7b8; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 14px;
    color: var(--text);
    z-index: 2000;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--accent2); }
  .toast.error { border-color: var(--danger); }

  @media (max-width: 768px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 16px; }
    .header { padding: 14px 16px; }
    .td-address { display: none; }
    th:nth-child(3), td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo-badge">Latino Built</span>
    <h1>HEA Payout Tracker</h1>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost" onclick="exportCSV()">⬇ Export</button>
    <button class="btn btn-primary" onclick="openModal()">+ Log HEA</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat">
    <span class="stat-label">Total HEAs</span>
    <span class="stat-value" id="stat-total">--</span>
  </div>
  <div class="stat">
    <span class="stat-label">Paid</span>
    <span class="stat-value green" id="stat-paid">--</span>
  </div>
  <div class="stat">
    <span class="stat-label">Unpaid</span>
    <span class="stat-value red" id="stat-unpaid">--</span>
  </div>
  <div class="stat">
    <span class="stat-label">Total Earned</span>
    <span class="stat-value amber" id="stat-amount">--</span>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('unpaid', this)">Unpaid</button>
      <button class="filter-btn" onclick="setFilter('paid', this)">Paid</button>
    </div>
    <input type="text" class="search-input" placeholder="Search client, address, contractor..." oninput="applySearch(this.value)">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Client</th>
          <th>Address</th>
          <th>Contractor</th>
          <th>Amount</th>
          <th>Paid</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="7"><div class="loading">Loading assessments...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add HEA Modal -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <h2>Log New HEA</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group">
        <label>Amount ($)</label>
        <input type="number" id="f-amount" value="250">
      </div>
    </div>
    <div class="form-group">
      <label>Client Name</label>
      <input type="text" id="f-client" placeholder="Full name">
    </div>
    <div class="form-group">
      <label>Address</label>
      <input type="text" id="f-address" placeholder="Street, City, OR">
    </div>
    <div class="form-group">
      <label>Contractor</label>
      <select id="f-contractor">
        <option value="">Select contractor...</option>
        <option>Olvera H&C (Eliseo)</option>
        <option>A's Heating & Cooling (Abraham)</option>
        <option>A&S Insulation (Mario)</option>
        <option>Dunamis (Miguel)</option>
        <option>JARA (Jose Reyes)</option>
        <option>MPS Heating (Mauro)</option>
        <option>Common Sense Heat Pump (Jesse)</option>
        <option>The Complete Solution (Joaquin)</option>
        <option>H.E.L.P. Group</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Notes (optional)</label>
      <textarea id="f-notes" rows="2" placeholder="Any notes..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveHEA()">Save HEA</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://tpbjsqwqfgwjymdcfouw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v7bPMHffLqZCZvma_D_cJg_L1sMVo3L';

let allRecords = [];
let currentFilter = 'all';
let currentSearch = '';

const headers = {
  'Content-Type': 'application/json',
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`
};

async function fetchRecords() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/hea_payout?select=*&order=date.desc`, { headers });
    if (!res.ok) throw new Error(await res.text());
    allRecords = await res.json();
    renderTable();
    updateStats();
  } catch (err) {
    document.getElementById('table-body').innerHTML = `<tr><td colspan="7"><div class="loading" style="color:#e74c3c">Error loading data. Check Supabase connection.</div></td></tr>`;
    console.error(err);
  }
}

function contractorClass(name) {
  if (!name) return 'c-other';
  const n = name.toLowerCase();
  if (n.includes('olvera')) return 'c-olvera';
  if (n.includes('jara') || n.includes('reyes')) return 'c-jara';
  if (n.includes('a&s') || n.includes('insulation')) return 'c-as';
  if (n.includes("a's") || n.includes('abraham')) return 'c-as-hc';
  if (n.includes('dunamis') || n.includes('miguel')) return 'c-dunamis';
  if (n.includes('mps') || n.includes('mauro')) return 'c-mps';
  return 'c-other';
}

function formatDate(d) {
  if (!d) return '--';
  const [y, m, day] = d.split('-');
  return `${m}/${day}/${y.slice(2)}`;
}

function getFiltered() {
  return allRecords.filter(r => {
    const matchFilter = currentFilter === 'all' || (currentFilter === 'paid' ? r.paid : !r.paid);
    const s = currentSearch.toLowerCase();
    const matchSearch = !s || [r.client_name, r.address, r.contractor, r.notes].some(f => f && f.toLowerCase().includes(s));
    return matchFilter && matchSearch;
  });
}

function renderTable() {
  const rows = getFiltered();
  const tbody = document.getElementById('table-body');

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="icon">📋</div><p>No assessments found</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr class="${r.paid ? 'is-paid' : ''}">
      <td class="td-date">${formatDate(r.date)}</td>
      <td class="td-client">${r.client_name || '--'}</td>
      <td class="td-address">${r.address || '--'}</td>
      <td><span class="contractor-tag ${contractorClass(r.contractor)}">${r.contractor || '--'}</span></td>
      <td class="td-amount">$${Number(r.amount || 0).toFixed(0)}</td>
      <td>
        <label class="paid-toggle">
          <span class="toggle-switch">
            <input type="checkbox" ${r.paid ? 'checked' : ''} onchange="togglePaid('${r.id}', this.checked)">
            <span class="toggle-slider"></span>
          </span>
          <span class="paid-label ${r.paid ? 'yes' : 'no'}">${r.paid ? 'PAID' : 'PENDING'}</span>
        </label>
      </td>
      <td><button class="action-btn" onclick="deleteRecord('${r.id}')" title="Delete">✕</button></td>
    </tr>
  `).join('');
}

function updateStats() {
  const paid = allRecords.filter(r => r.paid);
  const unpaid = allRecords.filter(r => !r.paid);
  const total = allRecords.reduce((s, r) => s + Number(r.amount || 0), 0);
  document.getElementById('stat-total').textContent = allRecords.length;
  document.getElementById('stat-paid').textContent = paid.length;
  document.getElementById('stat-unpaid').textContent = unpaid.length;
  document.getElementById('stat-amount').textContent = `$${total.toLocaleString()}`;
}

async function togglePaid(id, paid) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/hea_payout?id=eq.${id}`, {
      method: 'PATCH',
      headers,
      body: JSON.stringify({ paid })
    });
    if (!res.ok) throw new Error();
    const rec = allRecords.find(r => r.id === id);
    if (rec) rec.paid = paid;
    renderTable();
    updateStats();
    showToast(paid ? '✓ Marked as paid' : 'Marked as unpaid', paid ? 'success' : '');
  } catch {
    showToast('Error updating record', 'error');
  }
}

async function deleteRecord(id) {
  if (!confirm('Delete this HEA record?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/hea_payout?id=eq.${id}`, {
      method: 'DELETE',
      headers
    });
    if (!res.ok) throw new Error();
    allRecords = allRecords.filter(r => r.id !== id);
    renderTable();
    updateStats();
    showToast('Record deleted', '');
  } catch {
    showToast('Error deleting record', 'error');
  }
}

function openModal() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value = today;
  document.getElementById('f-client').value = '';
  document.getElementById('f-address').value = '';
  document.getElementById('f-contractor').value = '';
  document.getElementById('f-amount').value = '250';
  document.getElementById('f-notes').value = '';
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

async function saveHEA() {
  const date = document.getElementById('f-date').value;
  const client_name = document.getElementById('f-client').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const contractor = document.getElementById('f-contractor').value;
  const amount = parseFloat(document.getElementById('f-amount').value) || 250;
  const notes = document.getElementById('f-notes').value.trim();

  if (!date || !client_name || !contractor) {
    showToast('Date, client, and contractor are required', 'error');
    return;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/hea_payout`, {
      method: 'POST',
      headers: { ...headers, 'Prefer': 'return=representation' },
      body: JSON.stringify({ date, client_name, address, contractor, amount, notes, paid: false })
    });
    if (!res.ok) throw new Error(await res.text());
    const [newRec] = await res.json();
    allRecords.unshift(newRec);
    renderTable();
    updateStats();
    closeModal();
    showToast('✓ HEA logged successfully', 'success');
  } catch (err) {
    showToast('Error saving record', 'error');
    console.error(err);
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function applySearch(val) {
  currentSearch = val;
  renderTable();
}

function exportCSV() {
  const rows = getFiltered();
  const headers = ['Date', 'Client', 'Address', 'Contractor', 'Amount', 'Paid', 'Notes'];
  const csv = [headers, ...rows.map(r => [
    r.date, r.client_name, r.address, r.contractor, r.amount, r.paid ? 'Yes' : 'No', r.notes || ''
  ])].map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `HEA_Payout_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 2800);
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

fetchRecords();
</script>
</body>
</html>
